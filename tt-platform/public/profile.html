<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — TT Discover</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<script>
  (function(){
    if (localStorage.getItem('tt_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
<style>
  :root {
    --bg: #fdf6ec; --text: #2a2a2a; --text-muted: #777; --card-bg: #ffffff; --border: #e3d6c0;
    --input-bg: #ffffff; --input-border: #e8dcc8; --dark-btn: #232323;
  }
  [data-theme="dark"] {
    --bg: #16181d; --text: #e8e6e3; --text-muted: #a9a9a9; --card-bg: #22252b; --border: #33363d;
    --input-bg: #2a2d34; --input-border: #3a3d45; --dark-btn: #3a3d45;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header {
    background: linear-gradient(135deg, #e0562f, #f2a33c); color: #fff; padding: 18px 20px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  }
  header a { color: #fff; text-decoration: none; font-size: 15px; }
  header a:hover { text-decoration: underline; }
  header h1 { font-size: 22px; text-align: center; }
  .layout { max-width: 880px; margin: 0 auto; padding: 36px 20px 60px; display: grid; grid-template-columns: 240px 1fr; gap: 0; }
  .side { padding-right: 28px; border-right: 3px solid var(--text); display: flex; flex-direction: column; min-height: 520px; }
  .avatar {
    width: 160px; height: 160px; border-radius: 50%; background: #232323; color: #fff; font-size: 64px;
    display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 0 auto 22px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.editable { cursor: pointer; outline: 3px dashed #e0562f; outline-offset: 3px; }
  .summary div { font-size: 15px; margin-bottom: 8px; word-break: break-word; }
  .summary .sName { font-weight: 700; font-size: 17px; }
  .summary .sUser, .summary .sEmail { color: var(--text-muted); font-size: 14px; }
  button {
    font-family: inherit; font-size: 14px; border: none; border-radius: 22px; padding: 11px 18px;
    background: var(--dark-btn); color: #fff; cursor: pointer; font-weight: 600;
  }
  button:hover { filter: brightness(1.15); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid #e0562f; outline-offset: 2px; }
  .side button { margin-top: 10px; width: 100%; }
  .logout { margin-top: auto !important; background: none !important; color: var(--text) !important; text-align: left; padding-left: 0 !important; font-weight: 400 !important; }
  .logout:hover { text-decoration: underline; }
  .form { padding-left: 32px; }
  label { display: block; font-size: 14px; margin: 0 0 6px; }
  .field { margin-bottom: 22px; max-width: 420px; }
  input, textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--input-border);
    background: var(--input-bg); color: var(--text); font-size: 15px; font-family: inherit;
  }
  input[readonly], textarea[readonly] { background: transparent; border-color: var(--border); cursor: default; }
  textarea { min-height: 110px; resize: vertical; }
  .counter { font-size: 12px; color: var(--text-muted); text-align: right; margin-top: 3px; }
  .actions { display: none; gap: 10px; max-width: 420px; }
  .actions.show { display: flex; }
  .actions .ghost { background: none; color: var(--text); border: 1px solid var(--border); }
  .msg { margin-top: 12px; font-size: 13px; color: #e0562f; min-height: 18px; }
  @media (max-width: 680px) {
    .layout { grid-template-columns: 1fr; }
    .side { border-right: none; border-bottom: 3px solid var(--text); padding: 0 0 24px; min-height: 0; }
    .form { padding: 24px 0 0; }
    .logout { margin-top: 14px !important; }
  }
</style>
</head>
<body>
<header>
  <a href="/">← Go Back</a>
  <h1>Profile</h1>
  <span></span>
</header>

<div class="layout">
  <aside class="side">
    <div class="avatar" id="avatar" title="Change photo"></div>
    <input type="file" id="avatarFile" accept="image/*" style="display:none;">
    <div class="summary">
      <div class="sName" id="sName"></div>
      <div class="sUser" id="sUser"></div>
      <div id="sBio"></div>
    </div>
    <button type="button" id="editBtn">Edit profile</button>
    <div class="summary" style="margin-top:18px;"><div class="sEmail" id="sEmail"></div></div>
    <button type="button" class="logout" id="logoutBtn">Log Out</button>
  </aside>

  <section class="form">
    <div class="field"><label for="realName">Real name</label><input id="realName" maxlength="60" readonly></div>
    <div class="field"><label for="username">Username</label><input id="username" maxlength="30" readonly></div>
    <div class="field">
      <label for="bio">Small description</label>
      <textarea id="bio" maxlength="200" readonly></textarea>
      <div class="counter" id="bioCount" style="display:none;"></div>
    </div>
    <div class="field"><label for="email">Email</label><input id="email" readonly></div>
    <div class="actions" id="actions">
      <button type="button" id="saveBtn">Save</button>
      <button type="button" class="ghost" id="cancelBtn">Cancel</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
  </section>
</div>

<script src="/ui.js"></script>
<script>
const token = localStorage.getItem('ttp_token') || '';
if (!token) window.location.href = '/account.html';

const $ = id => document.getElementById(id);
let me = null, avatarUrl = '', editing = false;

function paintAvatar(){
  const label = (me && (me.username || me.email)) || '?';
  $('avatar').innerHTML = avatarUrl ? `<img src="${avatarUrl}" alt="">` : label[0].toUpperCase();
}
function paintSummary(){
  $('sName').textContent = me.realName || '';
  $('sUser').textContent = me.username ? '@' + me.username : '';
  $('sBio').textContent = me.bio || '';
  $('sEmail').textContent = me.email;
}
function fillFields(){
  $('realName').value = me.realName || '';
  $('username').value = me.username || '';
  $('bio').value = me.bio || '';
  $('email').value = me.email;
  avatarUrl = me.avatarUrl || '';
  paintAvatar();
}
function setEditing(on){
  editing = on;
  ['realName', 'username', 'bio'].forEach(id => $(id).readOnly = !on);
  $('actions').classList.toggle('show', on);
  $('avatar').classList.toggle('editable', on);
  $('avatar').title = on ? 'Change photo' : '';
  $('editBtn').style.display = on ? 'none' : 'block';
  $('bioCount').style.display = on ? 'block' : 'none';
  updateCount();
  if (on) $('realName').focus();
}
function updateCount(){ $('bioCount').textContent = $('bio').value.length + ' / 200'; }
$('bio').addEventListener('input', updateCount);

async function init(){
  const res = await fetch('/api/me', { headers: { 'x-auth-token': token } });
  if (!res.ok){ window.location.href = '/account.html'; return; }
  me = await res.json();
  fillFields();
  paintSummary();
}

$('editBtn').addEventListener('click', () => { $('msg').textContent = ''; setEditing(true); });
$('cancelBtn').addEventListener('click', () => { fillFields(); setEditing(false); $('msg').textContent = ''; });

$('avatar').addEventListener('click', () => { if (editing) $('avatarFile').click(); });
$('avatarFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')){ ttAlert('Please choose an image file.'); return; }
  const reader = new FileReader();
  reader.onload = (evt) => {
    const img = new Image();
    img.onload = () => {
      const size = 240, canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      canvas.getContext('2d').drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      avatarUrl = canvas.toDataURL('image/jpeg', 0.8);
      paintAvatar();
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
});

$('saveBtn').addEventListener('click', async () => {
  $('msg').textContent = 'Saving...';
  const body = {
    realName: $('realName').value.trim(),
    username: $('username').value.trim(),
    bio: $('bio').value.trim(),
    avatarUrl
  };
  const res = await fetch('/api/me/profile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok){ $('msg').textContent = data.error || 'Could not save profile.'; return; }
  me = { ...me, ...body };
  paintSummary();
  setEditing(false);
  $('msg').textContent = 'Saved!';
});

$('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('ttp_token');
  window.location.href = '/';
});

init();
</script>
<script src="/premium.js"></script>
</body>
</html>
