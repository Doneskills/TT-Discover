<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact us — TT Discover</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<script>try { if (localStorage.getItem('tt_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
<style>
  :root { --bg: #fdf6ec; --text: #2a2a2a; --muted: #6b6b6b; --card: #ffffff; --border: #eadfca; --input: #fdf6ec; }
  [data-theme="dark"] { --bg: #16181d; --text: #e8e6e3; --muted: #a9a9a9; --card: #22252b; --border: #33363d; --input: #2a2d34; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  header { background: linear-gradient(135deg, #e0562f, #f2a33c); color: #fff; padding: 16px 20px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  header a { color: #fff; text-decoration: none; font-size: 15px; }
  header h1 { font-size: 20px; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 18px 70px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px 20px; }
  p.lead { font-size: 15px; color: var(--muted); margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 5px; }
  input, select, textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--input); color: var(--text); font-family: inherit; font-size: 15px; }
  textarea { min-height: 130px; resize: vertical; }
  button { margin-top: 18px; width: 100%; padding: 13px; border: none; border-radius: 12px; background: #e0562f; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #e0562f; outline-offset: 2px; }
  .msg { min-height: 20px; margin-top: 12px; font-size: 14px; color: #e0562f; }
  .ok { text-align: center; padding: 10px 0; } .ok .big { font-size: 42px; }
</style>
</head>
<body>
<header><a href="/">← Back</a><h1>Contact us</h1><span></span></header>
<main>
  <div class="card" id="card">
    <p class="lead">Something not working, or a question about TT Discover? Write to us and we will reply by email.</p>
    <label for="name">Your name (optional)</label>
    <input id="name" maxlength="80" autocomplete="name">
    <label for="email">Your email</label>
    <input id="email" type="email" maxlength="150" autocomplete="email">
    <label for="topic">What is it about?</label>
    <select id="topic">
      <option>Something is not working</option>
      <option>Question about my business page</option>
      <option>Payments or Premium</option>
      <option>Report a problem or a person</option>
      <option>Something else</option>
    </select>
    <label for="message">Your message</label>
    <textarea id="message" maxlength="2000" placeholder="Tell us what happened. If you can, say which page you were on."></textarea>
    <div class="msg" id="msg" role="status"></div>
    <button type="button" id="sendBtn">Send message</button>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
(async function(){
  // If they are signed in, fill in their email to save typing.
  try {
    const t = localStorage.getItem('ttp_token');
    if (t){ const r = await fetch('/api/me', { headers: { 'x-auth-token': t } }); if (r.ok){ const me = await r.json(); if (me.email) $('email').value = me.email; } }
  } catch (e) {}
})();
$('sendBtn').addEventListener('click', async () => {
  const btn = $('sendBtn'), msg = $('msg');
  msg.textContent = '';
  btn.disabled = true;
  try {
    const res = await fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: $('name').value, email: $('email').value, topic: $('topic').value, message: $('message').value }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok){ msg.textContent = data.error || 'Could not send your message.'; btn.disabled = false; return; }
    $('card').innerHTML = '<div class="ok"><div class="big">✅</div><h2 style="margin:6px 0">Message sent</h2><p class="lead">Thank you. We will reply to your email as soon as we can.</p><a href="/" style="color:#e0562f;font-weight:600;">Back to TT Discover</a></div>';
  } catch (e) { msg.textContent = 'Could not reach the site. Please try again.'; btn.disabled = false; }
});
</script>
</body>
</html>
