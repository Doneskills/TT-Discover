<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--META-->
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<script>try { if (localStorage.getItem('tt_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Poppins:wght@400;500;600;700;800&family=Great+Vibes&family=Playfair+Display:wght@500;700&family=Bebas+Neue&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --surface: var(--surface); --divider: var(--divider); --track: var(--track); --starOff: var(--starOff); --fieldBorder: var(--fieldBorder); --field: #ffffff;
    --dealBg: var(--dealBg); --title: #23659b; --ok: #1a7a3c; --bad: #c40d0d;
    --primary: #23659b; --primary-soft: #3573a3; --bg: #f2f0eb; --text: #1f2a33; --muted: #5d6b76;
    --accent: #c40d0d; --star: #f5b301; --line: #23659b;
    --head: 'Oswald', 'Arial Narrow', Impact, sans-serif; --body: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #16181d; --text: #e8e6e3; --muted: #a9a9a9; --surface: #2a2d34; --divider: #33363d; --track: #3a3d45;
    --starOff: #555a63; --fieldBorder: #4a4d55; --field: #22252b; --dealBg: #3a3320; --title: #7db8e6; --ok: #4cc47c; --bad: #ff7b7b;
    --primary: #1b4f78; --primary-soft: #2b6a9b; --line: #3a7db5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--body); background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: inherit; }
  button, input, textarea { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  html { background: #f2f0eb; } html[data-theme="dark"] { background: #16181d; }
  /* Keep the page blank until we know which design it uses, so the default design never flashes first. */
  body:not(.ready) .shell, body:not(.ready) #previewBar { display: none; }
  body:not(.ready)::before { content: 'Loading...'; display: block; padding: 60px 20px; text-align: center; color: #8a8a8a; font-family: var(--body); }

  .embed body { min-height: 0; }
  .embed .shell { min-height: 0; }
  .embed .side { position: static; height: auto; }
  .embed .back { display: none; }
  .collage img { }
  .post { padding: 14px 0; border-bottom: 1px solid var(--divider); }
  .post .pd { font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
  .post img { max-width: 100%; border-radius: 12px; margin-top: 8px; cursor: zoom-in; }
  .aboutRow { font-size: 14px; margin: 5px 0; } .aboutRow b { color: var(--title); }
  .replyBox { margin-top: 8px; } .replyBox textarea { width: 100%; max-width: 480px; min-height: 52px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--fieldBorder); font-size: 13px; }
  .replyBox .btn { padding: 6px 14px; font-size: 13px; margin-top: 6px; }
  #previewBar { background: #232323; color: #fff; padding: 10px 16px; font-size: 14px; text-align: center; display: none; }
  #previewBar.show { display: block; }
  .shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--primary); color: #f2f0eb; padding: 28px 18px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; text-align: center; }
  html.embed #previewBar { display: none; }
  .logo { width: 84px; height: 84px; border-radius: 50%; background: #f2f0eb; border: 3px solid var(--accent); overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: var(--head); font-size: 34px; color: var(--primary); flex-shrink: 0; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .sideName { font-family: var(--head); font-size: 20px; text-transform: uppercase; margin: 12px 0 18px; letter-spacing: .5px; }
  .sideBig { font-family: var(--head); text-transform: uppercase; font-size: 54px; line-height: 1; margin: 34px 0; word-break: break-word; }
  .nav { width: 100%; margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
  .nav a { text-decoration: none; padding: 11px 14px; border-radius: 8px; font-size: 15px; text-align: left; }
  .nav a.active { background: rgba(255,255,255,.18); font-weight: 600; }
  .nav a:hover { background: rgba(255,255,255,.1); }
  .themeBtn { margin-top: 12px; background: rgba(255,255,255,.15); color: #fff; border: none; border-radius: 18px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .embed .themeBtn { display: none; }
  .back { font-size: 12px; opacity: .85; margin-top: 14px; text-decoration: none; }

  main { padding: 34px 40px 80px; min-width: 0; }
  h1.title { font-family: var(--head); font-weight: 500; font-size: 36px; color: var(--title); text-transform: uppercase; line-height: 1.1; }
  h2.sec { font-family: var(--head); font-weight: 500; font-size: 28px; color: var(--title); text-transform: uppercase; margin: 6px 0 12px; }
  .ratingRow { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-top: 6px; }
  .stars { color: var(--star); letter-spacing: 1px; }
  .stars .off { color: var(--starOff); }
  .meta { font-size: 14px; margin-top: 4px; }
  .meta .open { color: var(--ok); font-weight: 600; } .meta .closed { color: var(--bad); font-weight: 600; }
  hr.rule { border: none; border-top: 2px solid var(--line); margin: 16px 0; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .tile { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 4/3; background: var(--divider); border-bottom: 7px solid var(--primary); cursor: zoom-in; }
  .reportLink { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 2px 0; margin-top: 4px; font-family: inherit; }
  .reportForm { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; font-size: 13px; }
  .reportForm select, .reportForm input { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--fieldBorder); background: var(--field); color: var(--text); font-size: 13px; font-family: inherit; max-width: 100%; }
  .reportForm input { flex: 1 1 160px; min-width: 0; }
  .reportForm .btn { padding: 6px 12px; font-size: 13px; }
  .reportRow { margin-top: 34px; font-size: 12px; color: var(--muted); }
  .reportRow a { color: var(--muted); }
  .fabric .reportRow.fab { padding: 0 44px 30px; }
  .delPhoto { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; padding: 0; border: none; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; cursor: pointer; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap { font-size: 14px; margin-top: 6px; }
  .desc { font-size: 15px; line-height: 1.7; max-width: 640px; white-space: pre-line; }
  .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
  .contact { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
  .pill { display: flex; align-items: center; gap: 12px; background: var(--primary-soft); color: #fff; text-decoration: none; padding: 8px 22px 8px 8px; border-radius: 30px; font-weight: 600; font-size: 16px; min-width: 240px; }
  .pill .ic { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { background: var(--surface); border-radius: 16px; padding: 4px 12px; font-size: 13px; text-decoration: none; }
  .deal { background: var(--dealBg); border: 1px solid #f2c230; border-radius: 12px; padding: 12px 16px; margin-top: 16px; max-width: 640px; }
  .deal b { color: var(--accent); }
  .twoCol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 40px; margin-top: 8px; }
  .menuRow { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dotted var(--fieldBorder); font-size: 15px; }
  .menuRow span:last-child { font-weight: 600; white-space: nowrap; }

  .sumWrap { display: flex; gap: 34px; align-items: center; flex-wrap: wrap; }
  .bigNum { font-size: 56px; line-height: 1; font-weight: 500; }
  .bars { flex: 1; min-width: 220px; max-width: 420px; }
  .barRow { display: grid; grid-template-columns: 22px minmax(0, 1fr) 30px; gap: 8px; align-items: center; font-size: 13px; margin: 3px 0; }
  .barTrack { background: var(--track); height: 10px; border-radius: 5px; overflow: hidden; }
  .barFill { background: var(--star); height: 100%; }
  .rateRow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--text); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: var(--bg); overflow: hidden; }
  .pick { font-size: 34px; background: none; border: none; cursor: pointer; color: var(--starOff); padding: 0 2px; line-height: 1; }
  .pick.on { color: var(--text); }
  textarea.cmt { width: 100%; max-width: 560px; min-height: 80px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--fieldBorder); background: var(--field); color: var(--text); font-size: 14px; margin-top: 10px; resize: vertical; }
  .btn { background: var(--primary-soft); color: #fff; border: none; border-radius: 12px; padding: 9px 18px; font-size: 14px; cursor: pointer; }
  .btn.sel { background: var(--primary); box-shadow: inset 0 0 0 2px #0f3a5c; }
  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .iconBtn { width: 40px; height: 40px; border-radius: 50%; border: none; background: none; cursor: pointer; font-size: 20px; }
  #search { background: var(--field); color: var(--text); padding: 9px 12px; border-radius: 10px; border: 1px solid var(--fieldBorder); font-size: 14px; min-width: 0; flex: 1 1 160px; max-width: 280px; display: none; }
  .review { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--divider); }
  .review .who { font-weight: 600; font-size: 15px; } .review .when { font-size: 12px; color: var(--muted); margin-left: 8px; }
  .review p { font-size: 14px; line-height: 1.6; margin-top: 4px; white-space: pre-line; }
  .reply { background: var(--surface); border-radius: 10px; padding: 8px 12px; margin-top: 8px; font-size: 13px; }
  .msg { font-size: 13px; color: var(--accent); margin-top: 8px; min-height: 18px; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; z-index: 50; padding: 0; }
  #lightbox.show { display: flex; }
  #lightbox img { width: 100%; height: 100%; object-fit: contain; }
  #lightbox .x { position: absolute; top: 12px; right: 14px; width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; }


  /* ---------- Fabric design ---------- */
  body[data-template="fabric"] {
    --bg: #ebe6df; --text: #2a1810; --muted: #6d5a4c; --surface: #ddd3c6; --divider: #cdbfae; --track: #d8ccbc; --field: #f6f2ec;
    --fieldBorder: #b79f89; --title: #2a1810; --primary: #2a1810; --primary-soft: #4a2e1f; --line: #a8643a; --accent: #a8643a; --dealBg: #f3e6d6;
    --ok: #3b6b3b; --bad: #a33a1f; --star: #c98a3a; --starOff: #cdbfae; --side: #2a1810;
  }
  [data-theme="dark"] body[data-template="fabric"] {
    --bg: #1a1310; --text: #f0e6da; --muted: #b7a594; --surface: #2c211b; --divider: #3a2d25; --track: #3a2d25; --field: #241b16;
    --fieldBorder: #5a463a; --title: #f0e6da; --primary: #0f0a08; --primary-soft: #5a3a28; --line: #c98a5b; --accent: #c98a5b; --dealBg: #33261c;
    --ok: #7fc77f; --bad: #ff8a6b; --star: #e0a85a; --starOff: #4a3a30; --side: #0f0a08;
  }
  .fabric .shell { grid-template-columns: minmax(0, 1fr) 210px; }
  .fabric .side { grid-column: 2; grid-row: 1; background: var(--side); }
  .fabric main { grid-column: 1; grid-row: 1; padding: 0; }
  .fabric .pad { padding: 40px 44px 80px; }
  .fabric .sideBig { display: none; }
  .fabric .logo { border-color: var(--accent); }
  .fabric .sideName { font-family: var(--body); font-weight: 700; font-size: 15px; letter-spacing: 1px; margin-bottom: 22px; }
  .fabric .nav a { border-radius: 0; border-left: 3px solid transparent; }
  .fabric .nav a.active { background: transparent; border-left-color: var(--accent); font-weight: 600; }
  .fabric .nav { margin-top: 0; }
  .fabric h1.title { font-family: var(--body); font-weight: 800; font-size: clamp(38px, 6vw, 78px); line-height: .95; letter-spacing: -1px; }
  .fabric h2.sec { font-family: var(--body); font-weight: 700; font-size: 22px; letter-spacing: .5px; }
  .fabric .tile { border-radius: 0; border-bottom: none; aspect-ratio: 3/4; }
  .fabric .grid { gap: 22px; }
  .fabric .btn, .fabric .pill { border-radius: 4px; }
  .fabric .pill { background: transparent; color: #f3ece3; border: 1px solid rgba(243,236,227,.35); }
  .fabric .pill .ic { background: var(--accent); }

  /* ---------- Beauty and Construction designs ---------- */
  body[data-template="beauty"] {
    --bg: #fbf3f1; --text: #3b2a2e; --muted: #8a6f75; --surface: #f3e1e0; --divider: #ecd3d3; --track: #ecd3d3; --field: #ffffff;
    --fieldBorder: #d9b8bb; --title: #7a3b4b; --primary: #7a3b4b; --primary-soft: #955566; --accent: #c9967a; --line: #e3bfc0;
    --dealBg: #fbe7e3; --ok: #3b7a52; --bad: #b0392f; --star: #d9a441; --starOff: #e6cfcf;
    --head: 'Playfair Display', Georgia, 'Times New Roman', serif;
  }
  [data-theme="dark"] body[data-template="beauty"] {
    --bg: #1d1517; --text: #f3e4e4; --muted: #bfa3a8; --surface: #2b1f22; --divider: #3d2d31; --track: #3d2d31; --field: #241a1d;
    --fieldBorder: #5b4046; --title: #f0b9c4; --primary: #3b1f27; --primary-soft: #6b3a49; --accent: #e0a98c; --line: #8a5565;
    --dealBg: #3a2a25; --ok: #7fc79a; --bad: #ff8b80; --star: #e6b95a; --starOff: #5a454a;
  }
  body[data-template="build"] {
    --bg: #efede8; --text: #1d1d1b; --muted: #5f5f5a; --surface: #e2dfd8; --divider: #cfcbc2; --track: #d8d4cb; --field: #ffffff;
    --fieldBorder: #b7b2a6; --title: #1d1d1b; --primary: #222222; --primary-soft: #3a3a3a; --accent: #f5b000; --line: #f5b000;
    --dealBg: #fff1c2; --ok: #2f7d32; --bad: #c62828; --star: #f5b000; --starOff: #cfcab9;
  }
  [data-theme="dark"] body[data-template="build"] {
    --bg: #141414; --text: #f1efe9; --muted: #aaa69c; --surface: #242424; --divider: #383838; --track: #383838; --field: #1c1c1c;
    --fieldBorder: #4a4a4a; --title: #f5c542; --primary: #0c0c0c; --primary-soft: #2a2a2a; --accent: #f5b000; --line: #f5b000;
    --dealBg: #3a3220; --ok: #6fcf74; --bad: #ff7b72; --star: #f5b000; --starOff: #4a4a4a;
  }
  body[data-template="beauty"] main, body[data-template="build"] main { padding: 0; }
  body[data-template="beauty"] .pad, body[data-template="build"] .pad { padding: 34px 40px 80px; }
  body[data-template="beauty"] .sideBig, body[data-template="build"] .sideBig { display: none; }
  body[data-template="beauty"] .sideName { text-transform: none; font-size: 21px; font-weight: 700; margin-bottom: 26px; }
  body[data-template="beauty"] h1.title, body[data-template="beauty"] h2.sec { text-transform: none; font-weight: 700; letter-spacing: 0; }
  body[data-template="beauty"] .nav a { border-radius: 22px; }
  body[data-template="beauty"] .nav a.active { background: var(--accent); color: #fff; }
  body[data-template="beauty"] .tile { border-radius: 22px; border-bottom: none; }
  body[data-template="beauty"] .logo { border-color: var(--accent); }
  body[data-template="build"] .nav a { border-radius: 0; border-left: 5px solid transparent; text-transform: uppercase; font-weight: 600; letter-spacing: .5px; }
  body[data-template="build"] .nav a.active { background: var(--accent); color: var(--onAccent, #111); border-left-color: #111; }
  body[data-template="build"] .nav a:hover { background: rgba(255,255,255,.1); }
  body[data-template="build"] .tile { border-radius: 0; border-bottom: 6px solid var(--accent); }
  body[data-template="build"] .btn, body[data-template="build"] .pill, body[data-template="build"] .chip { border-radius: 2px; }
  body[data-template="build"] .logo { border-color: var(--accent); border-radius: 6px; }

  /* ---------- Premium designs: Bar and nightlife, Classes, Farm and market, Professional ---------- */
  body[data-template="bar"] {
    --bg: #f4eef9; --text: #231433; --muted: #6e5c86; --surface: #e8dcf4; --divider: #d8c6ea; --track: #d8c6ea; --field: #ffffff;
    --fieldBorder: #bba3d6; --title: #4a1d8a; --primary: #1a1030; --primary-soft: #2e1f52; --accent: #d81b86; --line: #b388eb;
    --dealBg: #f7dff0; --ok: #1b8a5a; --bad: #c62828; --star: #f2b01e; --starOff: #cdbfe0;
    --head: 'Bebas Neue', 'Oswald', Impact, sans-serif;
  }
  [data-theme="dark"] body[data-template="bar"] {
    --bg: #0d0818; --text: #f1e8fb; --muted: #b7a6cf; --surface: #1b1030; --divider: #2f2150; --track: #2f2150; --field: #150c26;
    --fieldBorder: #4a3875; --title: #ff8ed4; --primary: #07030f; --primary-soft: #251645; --accent: #ff3cac; --line: #7b4bd6;
    --dealBg: #33152b; --ok: #54d69b; --bad: #ff7b7b; --star: #ffd25a; --starOff: #4a3875;
  }
  body[data-template="learn"] {
    --bg: #f3f8ff; --text: #17304f; --muted: #587091; --surface: #e0eeff; --divider: #cfe2fb; --track: #cfe2fb; --field: #ffffff;
    --fieldBorder: #a9c6ee; --title: #1d5fd1; --primary: #1d5fd1; --primary-soft: #3a78e0; --accent: #f08a00; --line: #9cc3ff;
    --dealBg: #fff0d6; --ok: #1c8a4a; --bad: #c62828; --star: #f2b01e; --starOff: #cfdcf0;
  }
  [data-theme="dark"] body[data-template="learn"] {
    --bg: #0f1a2b; --text: #e8f0fc; --muted: #9db3d1; --surface: #182a45; --divider: #24395c; --track: #24395c; --field: #132238;
    --fieldBorder: #38588a; --title: #8fbbff; --primary: #12306b; --primary-soft: #1d4a99; --accent: #ffa733; --line: #3a6bbf;
    --dealBg: #3a2c14; --ok: #5bd68c; --bad: #ff7b7b; --star: #ffd25a; --starOff: #38588a;
  }
  body[data-template="farm"] {
    --bg: #f7f3e6; --text: #2b2a1c; --muted: #6d6a52; --surface: #ece5cd; --divider: #ddd4b5; --track: #ddd4b5; --field: #fffdf6;
    --fieldBorder: #c9bf9a; --title: #2f5d34; --primary: #2f5d34; --primary-soft: #46784b; --accent: #d9822b; --line: #b7c79a;
    --dealBg: #fbe9c9; --ok: #2f7d32; --bad: #b83a2a; --star: #e8a317; --starOff: #d9d1b4;
    --head: 'Merriweather', Georgia, 'Times New Roman', serif;
  }
  [data-theme="dark"] body[data-template="farm"] {
    --bg: #12160d; --text: #efecd9; --muted: #aeab8f; --surface: #1d2315; --divider: #2f3822; --track: #2f3822; --field: #171c10;
    --fieldBorder: #46512f; --title: #a9d58a; --primary: #1b3a1f; --primary-soft: #2e5a33; --accent: #f0a04b; --line: #5f7a3e;
    --dealBg: #3a2f17; --ok: #7fd687; --bad: #ff8b7a; --star: #f4be4a; --starOff: #46512f;
  }
  body[data-template="office"] {
    --bg: #f5f7fa; --text: #15233c; --muted: #5b6a82; --surface: #e8edf4; --divider: #d3dbe7; --track: #d3dbe7; --field: #ffffff;
    --fieldBorder: #b9c4d6; --title: #14284b; --primary: #14284b; --primary-soft: #263f6b; --accent: #b8914a; --line: #c9d3e0;
    --dealBg: #f4ead3; --ok: #2d7a4c; --bad: #b3372f; --star: #c99a2e; --starOff: #d3dbe7;
    --head: 'Playfair Display', Georgia, 'Times New Roman', serif;
  }
  [data-theme="dark"] body[data-template="office"] {
    --bg: #0e1626; --text: #e9eef7; --muted: #9eabc2; --surface: #172238; --divider: #25324d; --track: #25324d; --field: #121c30;

<body>
<div id="previewBar" role="status">Preview — this is how your page will look. Only you can see this. Close this tab to go back and change anything.</div>
<div class="shell">
  <aside class="side">
    <div class="logo" id="logo"></div>
    <div class="sideName" id="sideName"></div>
    <div class="sideBig" id="sideBig"></div>
    <nav class="nav" id="nav" aria-label="Business pages"></nav>
    <button class="themeBtn" id="themeBtn" type="button">🌙 Dark mode</button>
    <a class="back" href="/">← Back to TT Discover</a>
  </aside>
  <main id="main"><p class="empty">Loading...</p></main>
</div>

<script src="/ui.js"></script>
<script src="/hours.js"></script>
<script src="/lightbox.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
const embed = new URLSearchParams(location.search).get('embed') === '1';
if (embed) document.documentElement.classList.add('embed');
const embedMinH = Number(new URLSearchParams(location.search).get('minh')) || 0;
const previewMode = new URLSearchParams(location.search).get('preview') === '1';
const bizId = location.pathname.split('/').filter(Boolean).pop();
const token = localStorage.getItem('ttp_token') || '';
let biz = null, me = null, sortMode = 'relevant', query = '', pickRating = 0;

const DAYS = ['sun','mon','tue','wed','thu','fri','sat'];
// The photo used on the business page. The "main photo" (imageUrl) is only for the home page card; older pages without a business photo keep using it.
const pageCover = () => biz.coverUrl || biz.imageUrl || '';
// Designs that use the hero + services layout, with their own page names and button text.
const SV = {
  beauty: { menu: 'Services', photos: 'Gallery', cta: 'Call to book', feat: 'Favourites', none: 'No services listed yet.' },
  build: { menu: 'Services', photos: 'Projects', cta: 'Call for a quote', feat: 'Featured work', none: 'No services listed yet.' },
  bar: { menu: 'Drinks & menu', photos: 'Gallery', cta: 'Call to reserve', feat: 'House favourites', none: 'No menu items listed yet.' },
  learn: { menu: 'Classes', photos: 'Gallery', cta: 'Call to enrol', feat: 'Popular classes', none: 'No classes listed yet.' },
  farm: { menu: "What's fresh", photos: 'Gallery', cta: 'Call to order', feat: 'In season', none: 'Nothing listed yet.' },
  office: { menu: 'Services', photos: 'Our work', cta: 'Book a consultation', feat: 'Featured', none: 'No services listed yet.' }
};
const isSv = t => !!SV[t];
function pages(){
  const t = biz && biz.template;
  const l = t === 'fabric' ? [['home','Home'],['photos','Photos'],['reviews','Reviews']]
    : isSv(t) ? [['home','Home'],['menu',SV[t].menu],['photos',SV[t].photos],['reviews','Reviews']]
    : [['home','Home'],['menu','Menu'],['reviews','Reviews'],['photos','Photos']];
  if (biz && aboutFilled()) l.splice(1, 0, ['about','About']);
  if (biz && (biz.posts || []).length) l.push(['posts','Posts']);
  if (biz && ((biz.jobs || []).length || biz.hiring)) l.push(['jobs','Jobs']);
  return l;
}

function ratingOf(b){
  const rs = b.reviews || [];
  const count = rs.length;
  const avg = count ? rs.reduce((a, r) => a + r.rating, 0) / count : 0;
  return { count, avg };
}
function starsHtml(avg){
  const full = Math.round(avg);
  return `<span class="stars" aria-hidden="true">${[1,2,3,4,5].map(n => n <= full ? '★' : '<span class="off">★</span>').join('')}</span>`;
}
function fmt12(t){
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  return `${((h + 11) % 12) + 1}${m ? ':' + String(m).padStart(2, '0') : ''}${h >= 12 ? 'pm' : 'am'}`;
}
function openStatus(h){
  if (!h || typeof h === 'string') return { text: typeof h === 'string' ? h : '', known: false };
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Port_of_Spain' }));
  const mins = now.getHours() * 60 + now.getMinutes();
  const toM = t => { const [a, b] = String(t || '0:0').split(':').map(Number); return a * 60 + (b || 0); };
  const today = h[DAYS[now.getDay()]], yest = h[DAYS[(now.getDay() + 6) % 7]];
  // Still open from last night's shift that runs past midnight (e.g. 5pm - 1am)?
  if (yest && !yest.closed && toM(yest.close) <= toM(yest.open) && mins < toM(yest.close)) return { text: `Open · Closes ${fmt12(yest.close)}`, open: true, known: true };
  if (!today || today.closed) return { text: 'Closed today', open: false, known: true };
  const o = toM(today.open), c = toM(today.close);
  if (c <= o){ // closes after midnight
    if (mins >= o) return { text: `Open · Closes ${fmt12(today.close)}`, open: true, known: true };
    return { text: `Closed · Opens ${fmt12(today.open)}`, open: false, known: true };
  }
  if (mins >= o && mins < c) return { text: `Open · Closes ${fmt12(today.close)}`, open: true, known: true };
  if (mins < o) return { text: `Closed · Opens ${fmt12(today.open)}`, open: false, known: true };
  return { text: 'Closed for today', open: false, known: true };
}
function hoursLines(h){
  if (!h) return '';
  return esc(ttCompactHours(h));
}

function showErr(el, data, fallback){
  if (data && data.needsVerification){
    el.innerHTML = 'You need to confirm your email before you can do this. This keeps fake reviews and spam photos off the site. Check your inbox (and spam) for our email, or <a href="#" class="resendLink" style="color:var(--title);font-weight:600">send it again</a>.';
    el.querySelector('.resendLink').addEventListener('click', async e => {
      e.preventDefault();
      const r = await fetch('/api/resend-verification', { method: 'POST', headers: { 'x-auth-token': token } });
      const d = await r.json().catch(() => ({}));
      el.textContent = r.ok ? 'Email sent. Check your inbox (and spam), tap the link, then try again.' : (d.error || 'Could not send the email.');
    });
  } else el.textContent = (data && data.error) || fallback;
}
function route(){ const p = (location.hash || '#home').slice(1); return pages().some(x => x[0] === p) ? p : 'home'; }

function paintShell(){
  $('logo').innerHTML = biz.logoUrl ? `<img src="${biz.logoUrl}" alt="">` : esc((biz.name || '?')[0].toUpperCase());
  $('sideName').textContent = biz.name;
  $('sideBig').textContent = biz.tagline || 'Menu';
  const cur = route();
  $('nav').innerHTML = pages().map(([k, l]) => `<a href="#${k}" class="${k === cur ? 'active' : ''}" ${k === cur ? 'aria-current="page"' : ''}>${l}</a>`).join('');
}

function sendHeight(){
  if (!embed || window.parent === window) return;
  window.parent.postMessage({ ttEmbedHeight: Math.ceil(document.querySelector('.shell').getBoundingClientRect().height) }, location.origin);
}
let firstRender = true;
function render(){
  paintShell();
  const p = route();
  const m = $('main');
  const inner = p === 'home' ? homeHtml() : p === 'menu' ? menuHtml() : p === 'reviews' ? reviewsHtml() : p === 'posts' ? postsHtml() : p === 'jobs' ? jobsHtml() : p === 'about' ? aboutPageHtml() : photosHtml();
  document.documentElement.classList.toggle('fabric', biz.template === 'fabric');
  const hire = biz.hiring ? '<div class="hireBar"><a class="hireBtn" href="#jobs">💼 Hiring now</a></div>' : '';
  m.innerHTML = hire + ((biz.template === 'fabric' && p === 'home') ? inner + reportRowHtml() : (isSv(biz.template) && p === 'home') ? inner : `<div class="pad">${inner}${p === 'home' ? reportRowHtml() : ''}</div>`);
  window.scrollTo(0, 0);
  if (embed){
    m.querySelectorAll('a[href^="/"]').forEach(a => a.target = '_top');
    if (!firstRender && window.parent !== window) window.parent.postMessage({ ttEmbedTop: true }, location.origin);
    sendHeight();
  }
  firstRender = false;
  if (p === 'reviews') wireReviews();
  if (p === 'photos'){
    wirePhotos();
    if (!custLoaded && !previewMode){
      custLoaded = true;
      fetch(`/api/businesses/${bizId}/photos`).then(r => r.ok ? r.json() : []).then(l => { custPhotos = l; if (route() === 'photos') render(); }).catch(() => {});
    }
  }
  m.querySelectorAll('.tile img, .collage img, .post img').forEach(i => i.addEventListener('click', () => {
    if (embed && window.parent !== window){ window.parent.postMessage({ ttOpenPhoto: i.src }, location.origin); return; }
    window.ttLightbox.open(i.src);
  }));
}

function tiles(urls, cls){ return urls.length ? `<div class="grid ${cls || ''}">${urls.map(u => `<div class="tile"><img src="${u}" alt="" loading="lazy"></div>`).join('')}</div>` : ''; }

function homeFabric(){
  const r = ratingOf(biz), st = openStatus(biz.hours);
  const pics = [pageCover(), ...(biz.photos || [])].filter(Boolean).slice(0, 3);
  const now = new Date();
  const deals = (biz.deals || []).filter(d => !d.endDate || new Date(d.endDate) >= now);
  const soc = biz.social || {};
  const cls = ['', 'c1', '', ''];
  const collage = pics.map((u, i) => `<div class="${pics.length === 1 ? 'c1' : (i === 2 ? 'wide' : '')}"><img src="${u}" alt="" loading="lazy"></div>`).join('');
  return `<div class="fHome">
    <div class="fText">
      <h1 class="title">${esc(biz.name)}</h1>
      ${biz.tagline || biz.category ? `<div class="script">${esc(biz.tagline || biz.category)}</div>` : ''}
      <div class="fMeta">
        <div>${r.count ? `<b>${r.avg.toFixed(1)}</b> <span class="stars">★</span> (${r.count})` : 'No reviews yet'}</div>
        ${st.known ? `<div class="meta"><span class="${st.open ? 'open' : 'closed'}">${esc(st.text)}</span></div>` : (st.text ? `<div>${esc(st.text)}</div>` : '')}
        ${biz.hours ? `<div style="color:var(--muted);font-size:12px">${hoursLines(biz.hours)}</div>` : ''}
        ${biz.address || biz.area ? `<div>📍 ${esc([biz.address, biz.area].filter(Boolean).join(', '))}</div>` : ''}
      </div>
      ${biz.description ? `<p class="desc" style="margin-top:20px">${esc(biz.description)}</p>` : ''}
      ${deals.map(d => `<div class="deal"><b>🔥 ${esc(d.title)}</b><br>${esc(d.description)}</div>`).join('')}
      <div class="chips">${['facebook','instagram','website'].filter(k => soc[k]).map(k => `<a class="chip" href="${esc(soc[k])}" target="_blank" rel="noopener">${k[0].toUpperCase() + k.slice(1)}</a>`).join('')}</div>
    </div>
    <div class="fPanel">
      ${collage ? `<div class="collage">${collage}</div>` : ''}
      <div class="fContact">
        ${biz.email ? `<a href="mailto:${esc(biz.email)}">${esc(biz.email)}</a>` : ''}
        ${biz.phone ? `<a href="tel:${esc(biz.phone)}">${esc(biz.phone)}</a>` : ''}
      </div>
    </div>
  </div>`;
}
function homeService(){
  const r = ratingOf(biz), st = openStatus(biz.hours);
  const pics = [pageCover(), ...(biz.photos || [])].filter(Boolean);
  const hero = pageCover() || pics[0] || '';
  const strip = pics.slice(hero === pics[0] ? 1 : 0, 5);
  const now = new Date();
  const deals = (biz.deals || []).filter(d => !d.endDate || new Date(d.endDate) >= now);

function shrink(file){
  return new Promise(res => {
    const r = new FileReader();
    r.onload = e => { const img = new Image(); img.onload = () => {
      const m = 1000; let w = img.width, h = img.height;
      if (w > m || h > m){ if (w > h){ h = Math.round(h * m / w); w = m; } else { w = Math.round(w * m / h); h = m; } }
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      res(c.toDataURL('image/jpeg', 0.75)); }; img.src = e.target.result; };
    r.readAsDataURL(file);
  });
}

function sortedReviews(){
  let list = [...(biz.reviews || [])];
  const q = query.trim().toLowerCase();
  if (q) list = list.filter(r => (r.comment + ' ' + r.authorName).toLowerCase().includes(q));
  if (sortMode === 'newest') list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  else if (sortMode === 'highest') list.sort((a, b) => b.rating - a.rating || new Date(b.createdAt) - new Date(a.createdAt));
  else if (sortMode === 'lowest') list.sort((a, b) => a.rating - b.rating || new Date(b.createdAt) - new Date(a.createdAt));
  else list.sort((a, b) => (b.comment.length - a.comment.length) || (new Date(b.createdAt) - new Date(a.createdAt)));
  return list;
}

if (embed && embedMinH) document.querySelector('.shell').style.minHeight = embedMinH + 'px';
if (embed && window.ResizeObserver) new ResizeObserver(sendHeight).observe(document.querySelector('.shell'));


// ---------------- Owner-picked page colour ----------------
function hexToHsl(hex){
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d){
    s = d / (1 - Math.abs(2 * l - 1));
    h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h = Math.round(h * 60); if (h < 0) h += 360;
  }
  return [h, Math.round(s * 100), Math.round(l * 100)];
}
function hexLum(hex){
  const f = i => { const v = parseInt(hex.slice(i, i + 2), 16) / 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
  return .2126 * f(1) + .7152 * f(3) + .0722 * f(5);
}
// Overrides the design's own colours on the page. An empty value goes back to the design's colours.
function applyBrand(hex){
  const st = document.body.style;
  ['--primary', '--primary-soft', '--accent', '--line', '--title', '--onAccent'].forEach(k => st.removeProperty(k));
  if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return;
  const t = document.body.dataset.template || 'food';
  const dk = document.documentElement.getAttribute('data-theme') === 'dark';
  const [h, s0] = hexToHsl(hex);
  const s = Math.max(25, Math.min(s0, 75));
  const c = (sat, l) => 'hsl(' + h + ', ' + sat + '%, ' + l + '%)';
  const set = (k, v) => st.setProperty(k, v);
  const vivid = c(Math.max(s0, 55), dk ? 62 : 46);
  if (t === 'build'){
    set('--accent', hex); set('--line', hex); set('--onAccent', hexLum(hex) > .4 ? '#111' : '#fff');
  } else if (t === 'beauty' || t === 'bar' || t === 'learn' || t === 'farm' || t === 'office'){
    set('--primary', c(s, dk ? 16 : 32)); set('--title', c(s, dk ? 82 : 32)); set('--primary-soft', c(s, dk ? 28 : 42));
    set('--accent', vivid); set('--line', c(s, dk ? 38 : 84));
  } else if (t === 'fabric'){
    set('--primary', c(s, dk ? 9 : 14)); set('--primary-soft', c(s, dk ? 24 : 24)); set('--title', c(s, dk ? 88 : 14));
    set('--accent', vivid); set('--line', vivid);
  } else {
    set('--primary', c(s, dk ? 20 : 30)); set('--primary-soft', c(s, dk ? 30 : 40)); set('--title', c(s, dk ? 72 : 34)); set('--accent', vivid); set('--line', c(s, dk ? 42 : 30));
  }
}
new MutationObserver(() => { if (biz) applyBrand(biz.brandColor); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
// Business Studio sends the colour being tried so its preview changes live.
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !previewMode || !biz) return;
  const d = e.data || {};
  if (typeof d.ttBrand === 'string'){ biz.brandColor = d.ttBrand; applyBrand(d.ttBrand); }
});

(async function init(){
  if (previewMode){
    try { biz = JSON.parse(localStorage.getItem('ttp_preview_draft') || 'null'); } catch (e) { biz = null; }
    if (!biz){ document.body.classList.add('ready'); $('main').innerHTML = '<h1 class="title">Nothing to preview</h1><p class="desc">Go back to Business Studio and click View it again.</p>'; return; }
    biz.name = biz.name || 'Your business name'; biz.reviews = biz.reviews || [];
    $('previewBar').classList.add('show');
    document.title = 'Preview — ' + biz.name;
    document.body.dataset.template = biz.template || 'food';
    applyBrand(biz.brandColor);
    document.body.classList.add('ready'); render();
    return;
  }
  const [b, u] = await Promise.all([
    fetch('/api/businesses/' + bizId).then(r => r.ok ? r.json() : null).catch(() => null),
    token ? fetch('/api/me', { headers: { 'x-auth-token': token } }).then(r => r.ok ? r.json() : null).catch(() => null) : null
  ]);
  if (!b){ document.body.classList.add('ready'); $('main').innerHTML = '<h1 class="title">Listing not found</h1><p class="desc"><a href="/">Back to TT Discover</a></p>'; return; }
  biz = b; me = u;
  document.title = biz.name + ' — TT Discover';
  document.body.dataset.template = biz.template || 'food';
  applyBrand(biz.brandColor);
  document.body.classList.add('ready'); render();
})();
</script>
