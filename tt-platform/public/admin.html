<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — TT Discover</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  :root { --card-bg: #241c15; --text: #f5ede1; --border: #4a3a28; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1410; color: #f5ede1; padding: 20px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 18px; color: #f2a33c; }
  label { display: block; font-size: 12px; text-transform: uppercase; color: #cbbfae; margin: 14px 0 5px; }
  input, textarea {
    width: 100%; padding: 9px 10px; background: #241c15; border: 1px solid #4a3a28;
    border-radius: 6px; color: #f5ede1; font-size: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    margin-top: 16px; width: 100%; padding: 11px; background: #e0562f; color: #fff;
    border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #ec6b45; }
  .msg { margin-top: 10px; font-size: 13px; color: #f2a33c; min-height: 18px; }
  #loginBox, #panel { display: none; }
  .bizRow {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid #3a2e21; font-size: 13px;
  }
  .bizRow button {
    width: auto; margin: 0; padding: 6px 12px; background: #7a2c2c; font-size: 12px;
  }
  .repItem { border: 1px solid #4a3a28; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
  .repItem .why { color: #f2a33c; font-weight: 700; }
  .repItem img { max-width: 140px; border-radius: 6px; display: block; margin: 6px 0; }
  .repItem .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .repItem .acts button { width: auto; margin: 0; padding: 6px 12px; font-size: 12px; }
  .repItem .acts .quiet { background: #3a2e21; }
  hr { border: none; border-top: 1px solid #3a2e21; margin: 24px 0; }
  .dropZone {
    border: 2px dashed #4a3a28; border-radius: 10px; padding: 20px; text-align: center;
    cursor: pointer; font-size: 13px; color: #cbbfae; transition: border-color 0.2s;
  }
  .dropZone.dragover { border-color: #f2a33c; color: #f2a33c; }
  .dropZone img { max-width: 100%; max-height: 160px; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠️ Admin</h1>

  <div id="loginBox">
    <label>Admin Password</label>
    <input type="password" id="passwordInput">
    <button id="loginBtn">Log In</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panel">
    <h1 style="font-size:16px;">🚩 Reports <span id="repCount" style="color:#cbbfae;font-weight:400;"></span></h1>
    <div id="repList"><div class="msg">Loading...</div></div>
    <hr>
    <h1 style="font-size:16px;">Existing Listings</h1>
    <div id="bizList"></div>
  </div>
</div>

<script src="/ui.js"></script>
<script>
let adminPassword = '';

document.getElementById('loginBtn').addEventListener('click', async () => {
  const pw = document.getElementById('passwordInput').value;
  const res = await fetch('/api/admin/check', { method: 'POST', headers: { 'x-admin-password': pw } });
  if (res.ok){
    adminPassword = pw;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadList();
    loadReports();
  } else {
    document.getElementById('loginMsg').textContent = 'Incorrect password.';
  }
});

async function loadReports(){
  const box = document.getElementById('repList');
  let list = [];
  try {
    const res = await fetch('/api/admin/reports', { headers: { 'x-admin-password': adminPassword } });
    list = res.ok ? await res.json() : [];
  } catch (e) { list = []; }
  document.getElementById('repCount').textContent = list.length ? '(' + list.length + ' open)' : '';
  box.innerHTML = '';
  if (!list.length){ box.innerHTML = '<div class="msg">No open reports. 🎉</div>'; return; }
  list.forEach(r => {
    const d = document.createElement('div'); d.className = 'repItem';
    const head = document.createElement('div');
    head.innerHTML = '<span class="why"></span> · <span class="what"></span>';
    head.querySelector('.why').textContent = r.reason;
    head.querySelector('.what').textContent = r.type + ' on "' + (r.bizName || 'deleted business') + '"';
    d.appendChild(head);
    if (r.preview){ const p = document.createElement('div'); p.textContent = r.preview; d.appendChild(p); }
    if (r.imageUrl){ const im = document.createElement('img'); im.src = r.imageUrl; d.appendChild(im); }
    if (r.details){ const n = document.createElement('div'); n.style.color = '#cbbfae'; n.textContent = 'Note: ' + r.details; d.appendChild(n); }
    const who = document.createElement('div'); who.style.color = '#8a7a68'; who.textContent = 'Reported by ' + r.reporterEmail + ' on ' + new Date(r.createdAt).toLocaleDateString(); d.appendChild(who);
    if (r.gone){ const g = document.createElement('div'); g.style.color = '#f2a33c'; g.textContent = 'This content is already gone.'; d.appendChild(g); }
    const acts = document.createElement('div'); acts.className = 'acts';
    if (r.type !== 'business' && !r.gone){
      const rm = document.createElement('button'); rm.textContent = 'Remove ' + r.type;
      rm.addEventListener('click', async () => {
        if (!(await ttConfirm('Remove this ' + r.type + ' for good?', { title: 'Remove ' + r.type, ok: 'Remove', danger: true }))) return;
        await fetch('/api/admin/reports/' + r._id + '/remove', { method: 'POST', headers: { 'x-admin-password': adminPassword } });
        loadReports();
      });
      acts.appendChild(rm);
    }
    if (r.type === 'business' && !r.gone){
      const delb = document.createElement('button'); delb.textContent = 'Delete business';
      delb.addEventListener('click', async () => {
        if (!(await ttConfirm('Delete "' + (r.bizName || 'this business') + '" for good? This cannot be undone.', { title: 'Delete business', ok: 'Delete', danger: true }))) return;
        await fetch('/api/admin/businesses/' + r.bizId, { method: 'DELETE', headers: { 'x-admin-password': adminPassword } });
        loadReports(); loadList();
      });
      acts.appendChild(delb);
    }
    const dis = document.createElement('button'); dis.className = 'quiet'; dis.textContent = 'Dismiss';
    dis.addEventListener('click', async () => {
      await fetch('/api/admin/reports/' + r._id + '/dismiss', { method: 'POST', headers: { 'x-admin-password': adminPassword } });
      loadReports();
    });
    acts.appendChild(dis);
    if (r.bizId && !r.gone){ const a = document.createElement('a'); a.href = '/biz/' + r.bizId; a.target = '_blank'; a.textContent = 'View business ↗'; a.style.cssText = 'font-size:12px;color:#f2a33c;text-decoration:none;'; acts.appendChild(a); }
    d.appendChild(acts);
    box.appendChild(d);
  });
}

async function loadList(){
  const res = await fetch('/api/businesses');
  const list = await res.json();
  const box = document.getElementById('bizList');
  box.innerHTML = list.length ? '' : '<div class="msg">No listings yet.</div>';
  list.forEach(biz => {
    const row = document.createElement('div');
    row.className = 'bizRow';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = biz.name;
    row.appendChild(nameSpan);
    const viewLink = document.createElement('a');
    viewLink.href = '/biz/' + biz._id;
    viewLink.target = '_blank';
    viewLink.textContent = '🔗 View';
    viewLink.style.cssText = 'font-size:12px;color:#f2a33c;text-decoration:none;margin-right:10px;';
    const delBtn = document.createElement('button');
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', async () => {
      if (!(await ttConfirm('Delete "' + biz.name + '" for good? This cannot be undone.', { title: 'Delete business', ok: 'Delete', danger: true }))) return;
      await fetch('/api/admin/businesses/' + biz._id, { method: 'DELETE', headers: { 'x-admin-password': adminPassword } });
      loadList(); loadReports();
    });
    row.appendChild(viewLink);
    row.appendChild(delBtn);
    box.appendChild(row);
  });
}

document.getElementById('loginBox').style.display = 'block';
</script>
</body>
</html>
