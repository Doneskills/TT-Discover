<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — TT Discover</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1410; color: #f5ede1; padding: 20px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; margin-bottom: 18px; color: #f2a33c; }
  label { display: block; font-size: 12px; text-transform: uppercase; color: #cbbfae; margin: 14px 0 5px; }
  input, textarea {
    width: 100%; padding: 9px 10px; background: #241c15; border: 1px solid #4a3a28;
    border-radius: 6px; color: #f5ede1; font-size: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    margin-top: 16px; width: 100%; padding: 11px; background: #e0562f; color: #fff;
    border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #ec6b45; }
  .msg { margin-top: 10px; font-size: 13px; color: #f2a33c; min-height: 18px; }
  #loginBox, #panel { display: none; }
  .bizRow {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid #3a2e21; font-size: 13px;
  }
  .bizRow button {
    width: auto; margin: 0; padding: 6px 12px; background: #7a2c2c; font-size: 12px;
  }
  .repItem { border: 1px solid #4a3a28; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
  .repItem .why { color: #f2a33c; font-weight: 700; }
  .repItem img { max-width: 140px; border-radius: 6px; display: block; margin: 6px 0; }
  .repItem .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .repItem .acts button { width: auto; margin: 0; padding: 6px 12px; font-size: 12px; }
  .repItem .acts .quiet { background: #3a2e21; }
  hr { border: none; border-top: 1px solid #3a2e21; margin: 24px 0; }
  .dropZone {
    border: 2px dashed #4a3a28; border-radius: 10px; padding: 20px; text-align: center;
    cursor: pointer; font-size: 13px; color: #cbbfae; transition: border-color 0.2s;
  }
  .dropZone.dragover { border-color: #f2a33c; color: #f2a33c; }
  .dropZone img { max-width: 100%; max-height: 160px; border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠️ Admin — Add a Business</h1>

  <div id="loginBox">
    <label>Admin Password</label>
    <input type="password" id="passwordInput">
    <button id="loginBtn">Log In</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panel">
    <h1 style="font-size:16px;">🚩 Reports <span id="repCount" style="color:#cbbfae;font-weight:400;"></span></h1>
    <div id="repList"><div class="msg">Loading...</div></div>
    <hr>
    <label>Business Name</label>
    <input type="text" id="name">
    <label>Description</label>
    <textarea id="description"></textarea>
    <label>Address</label>
    <input type="text" id="address">
    <label>Phone</label>
    <input type="text" id="phone">
    <label>Hours (e.g. Mon-Sat 11am-9pm)</label>
    <input type="text" id="hours">
    <label>Photo (optional)</label>
    <div id="dropZone" class="dropZone">
      <div id="dropZoneText">📷 Drag &amp; drop a photo here, or click to choose</div>
      <img id="imagePreview" style="display:none;">
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
    <div id="useUrlToggle" style="font-size:12px;color:#8a7a68;margin-top:6px;cursor:pointer;text-decoration:underline;">or paste an image link instead</div>
    <input type="text" id="imageUrl" style="display:none;margin-top:6px;" placeholder="https://...">

    <hr>
    <label>Deal Title (optional)</label>
    <input type="text" id="dealTitle" placeholder="e.g. 20% off lunch specials">
    <label>Deal Description</label>
    <textarea id="dealDescription"></textarea>
    <label>Deal Ends (optional date)</label>
    <input type="date" id="dealEndDate">

    <label style="display:flex;align-items:center;gap:8px;margin-top:14px;text-transform:none;">
      <input type="checkbox" id="featuredCheck" style="width:auto;">
      ⭐ Feature this listing (shows above others)
    </label>

    <button id="addBtn">Add Business</button>
    <div class="msg" id="addMsg"></div>

    <hr>
    <h1 style="font-size:16px;">Existing Listings</h1>
    <div id="bizList"></div>
  </div>
</div>

<script>
let adminPassword = '';

// ---------------- Drag-and-drop image picker ----------------
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const imagePreview = document.getElementById('imagePreview');
const dropZoneText = document.getElementById('dropZoneText');
const imageUrlInput = document.getElementById('imageUrl');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleImageFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleImageFile(e.target.files[0]); });

function handleImageFile(file){
  if (!file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }
  const reader = new FileReader();
  reader.onload = (evt) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 800;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim){
        if (w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      imageUrlInput.value = dataUrl;
      imagePreview.src = dataUrl;
      imagePreview.style.display = 'block';
      dropZoneText.style.display = 'none';
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}
function resetImagePicker(){
  imagePreview.style.display = 'none';
  imagePreview.src = '';
  dropZoneText.style.display = 'block';
  imageUrlInput.style.display = 'none';
}
document.getElementById('useUrlToggle').addEventListener('click', () => {
  imageUrlInput.style.display = imageUrlInput.style.display === 'none' ? 'block' : 'none';
});

document.getElementById('loginBtn').addEventListener('click', async () => {
  const pw = document.getElementById('passwordInput').value;
  const res = await fetch('/api/admin/check', { method: 'POST', headers: { 'x-admin-password': pw } });
  if (res.ok){
    adminPassword = pw;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadList();
    loadReports();
  } else {
    document.getElementById('loginMsg').textContent = 'Incorrect password.';
  }
});

document.getElementById('addBtn').addEventListener('click', async () => {
  const body = {
    name: document.getElementById('name').value,
    description: document.getElementById('description').value,
    address: document.getElementById('address').value,
    phone: document.getElementById('phone').value,
    hours: document.getElementById('hours').value,
    imageUrl: document.getElementById('imageUrl').value,
    dealTitle: document.getElementById('dealTitle').value,
    dealDescription: document.getElementById('dealDescription').value,
    dealEndDate: document.getElementById('dealEndDate').value
  };
  if (!body.name.trim()){
    document.getElementById('addMsg').textContent = 'Name is required.';
    return;
  }
  const res = await fetch('/api/admin/businesses', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
    body: JSON.stringify(body)
  });
  if (res.ok){
    document.getElementById('addMsg').textContent = 'Added!';
    ['name','description','address','phone','hours','imageUrl','dealTitle','dealDescription','dealEndDate'].forEach(id => {
      document.getElementById(id).value = '';
    });
    resetImagePicker();
    loadList();
  } else {
    document.getElementById('addMsg').textContent = 'Could not add business.';
  }
});


async function loadReports(){
  const box = document.getElementById('repList');
  let list = [];
  try {
    const res = await fetch('/api/admin/reports', { headers: { 'x-admin-password': adminPassword } });
    list = res.ok ? await res.json() : [];
  } catch (e) { list = []; }
  document.getElementById('repCount').textContent = list.length ? '(' + list.length + ' open)' : '';
  box.innerHTML = '';
  if (!list.length){ box.innerHTML = '<div class="msg">No open reports. 🎉</div>'; return; }
  list.forEach(r => {
    const d = document.createElement('div'); d.className = 'repItem';
    const head = document.createElement('div');
    head.innerHTML = '<span class="why"></span> · <span class="what"></span>';
    head.querySelector('.why').textContent = r.reason;
    head.querySelector('.what').textContent = r.type + ' on "' + (r.bizName || 'deleted business') + '"';
    d.appendChild(head);
    if (r.preview){ const p = document.createElement('div'); p.textContent = r.preview; d.appendChild(p); }
    if (r.imageUrl){ const im = document.createElement('img'); im.src = r.imageUrl; d.appendChild(im); }
    if (r.details){ const n = document.createElement('div'); n.style.color = '#cbbfae'; n.textContent = 'Note: ' + r.details; d.appendChild(n); }
    const who = document.createElement('div'); who.style.color = '#8a7a68'; who.textContent = 'Reported by ' + r.reporterEmail + ' on ' + new Date(r.createdAt).toLocaleDateString(); d.appendChild(who);
    if (r.gone){ const g = document.createElement('div'); g.style.color = '#f2a33c'; g.textContent = 'This content is already gone.'; d.appendChild(g); }
    const acts = document.createElement('div'); acts.className = 'acts';
    if (r.type !== 'business' && !r.gone){
      const rm = document.createElement('button'); rm.textContent = 'Remove ' + r.type;
      rm.addEventListener('click', async () => {
        if (!confirm('Remove this ' + r.type + ' for good?')) return;
        await fetch('/api/admin/reports/' + r._id + '/remove', { method: 'POST', headers: { 'x-admin-password': adminPassword } });
        loadReports();
      });
      acts.appendChild(rm);
    }
    const dis = document.createElement('button'); dis.className = 'quiet'; dis.textContent = 'Dismiss';
    dis.addEventListener('click', async () => {
      await fetch('/api/admin/reports/' + r._id + '/dismiss', { method: 'POST', headers: { 'x-admin-password': adminPassword } });
      loadReports();
    });
    acts.appendChild(dis);
    if (r.bizId && !r.gone){ const a = document.createElement('a'); a.href = '/biz/' + r.bizId; a.target = '_blank'; a.textContent = 'View business ↗'; a.style.cssText = 'font-size:12px;color:#f2a33c;text-decoration:none;'; acts.appendChild(a); }
    d.appendChild(acts);
    box.appendChild(d);
  });
}

async function loadList(){
  const res = await fetch('/api/businesses');
  const list = await res.json();
  const box = document.getElementById('bizList');
  box.innerHTML = list.length ? '' : '<div class="msg">No listings yet.</div>';
  list.forEach(biz => {
    const row = document.createElement('div');
    row.className = 'bizRow';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = biz.name;
    row.appendChild(nameSpan);
    const viewLink = document.createElement('a');
    viewLink.href = '/biz/' + biz._id;
    viewLink.target = '_blank';
    viewLink.textContent = '🔗 View';
    viewLink.style.cssText = 'font-size:12px;color:#f2a33c;text-decoration:none;margin-right:10px;';
    const delBtn = document.createElement('button');
    delBtn.textContent = 'Delete';
    delBtn.addEventListener('click', async () => {
      await fetch('/api/admin/businesses/' + biz._id, { method: 'DELETE', headers: { 'x-admin-password': adminPassword } });
      loadList();
    });
    row.appendChild(viewLink);
    row.appendChild(delBtn);
    box.appendChild(row);
  });
}

document.getElementById('loginBox').style.display = 'block';
</script>
</body>
</html>
