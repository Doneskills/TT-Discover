<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — TT Discover</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<script>
  (function(){
    var saved = localStorage.getItem('tt_theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
<style>
  :root {
    --bg: #fdf6ec; --text: #2a2a2a; --text-muted: #999; --text-muted3: #777;
    --card-bg: #ffffff; --border: #eee; --input-bg: #fdf6ec; --input-border: #e8dcc8;
    --soft-bg: #f0e4d0; --soft-bg-hover: #e8dcc8;
  }
  [data-theme="dark"] {
    --bg: #16181d; --text: #e8e6e3; --text-muted: #999; --text-muted3: #a9a9a9;
    --card-bg: #22252b; --border: #33363d; --input-bg: #2a2d34; --input-border: #3a3d45;
    --soft-bg: #33363d; --soft-bg-hover: #3a3d45;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header {
    background: linear-gradient(135deg, #e0562f, #f2a33c); color: #fff;
    padding: 18px 20px; display: flex; justify-content: space-between; align-items: center;
  }
  header a { color: #fff; text-decoration: none; font-size: 14px; opacity: 0.9; }
  header h1 { font-size: 18px; }
  header button { margin: 0; width: auto; padding: 8px 14px; font-size: 13px; background: rgba(0,0,0,0.15); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 60px; }
  .card {
    background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  h2 { font-size: 17px; margin-bottom: 12px; }
  label { display: block; font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin: 12px 0 5px; }
  input, textarea, select {
    width: 100%; padding: 9px 10px; background: var(--input-bg); border: 1px solid var(--input-border);
    border-radius: 6px; color: var(--text); font-size: 14px;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    margin-top: 14px; width: 100%; padding: 10px; background: #e0562f; color: #fff;
    border: none; border-radius: 6px; font-weight: 700; cursor: pointer;
  }
  button.secondary { background: var(--soft-bg); color: var(--text); }
  .msg { margin-top: 10px; font-size: 13px; color: #e0562f; min-height: 16px; }
  hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
  #loadingView { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 14px; }

  .profileRow { display: flex; gap: 16px; align-items: center; }
  .settingsAvatar {
    width: 72px; height: 72px; border-radius: 50%; background: #e0562f; color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700;
    overflow: hidden; flex-shrink: 0; cursor: pointer;
  }
  .settingsAvatar img { width: 100%; height: 100%; object-fit: cover; }
  .emailNote { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  .bizAccordionRow { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .bizAccordionHead {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
    cursor: pointer; font-size: 14px; font-weight: 700; background: var(--soft-bg);
  }
  .bizAccordionHead:hover { background: var(--soft-bg-hover); }
  .bizAccordionHead .meta { font-weight: 400; font-size: 12px; color: var(--text-muted); margin-left: 8px; }
  .collabTag { display: inline-block; font-size: 11px; background: var(--card-bg); padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
  .bizAccordionBody { display: none; padding: 16px; }
  .bizAccordionBody.open { display: block; }
  .bizAccordionHead .chev { transition: transform 0.15s; }
  .bizAccordionHead.open .chev { transform: rotate(90deg); }

  .dropZone {
    border: 2px dashed var(--input-border); border-radius: 10px; padding: 16px; text-align: center;
    cursor: pointer; font-size: 13px; color: var(--text-muted); margin-top: 6px;
  }
  .dropZone img { max-width: 100%; max-height: 140px; border-radius: 8px; }
</style>
</head>
<body>

<header>
  <a href="/">← Back to TT Discover</a>
  <h1>Settings</h1>
  <button id="logoutBtn" type="button">Log Out</button>
</header>

<div class="wrap">
  <div id="loadingView">Loading...</div>

  <div id="settingsView" style="display:none;">
    <div class="card">
      <h2>Profile and Username</h2>
      <div class="profileRow">
        <div id="avatarPreview" class="settingsAvatar" title="Change photo">👤</div>
        <div style="flex:1;">
          <input type="file" id="avatarFileInput" accept="image/*" style="display:none;">
          <button type="button" id="avatarPickBtn" class="secondary" style="margin-top:0;">Change Photo</button>
        </div>
      </div>
      <label>Username</label>
      <input type="text" id="usernameInput" maxlength="30" placeholder="Pick a username">
      <div class="emailNote" id="emailDisplay"></div>
      <button id="saveProfileBtn">Save Profile</button>
      <div class="msg" id="profileMsg"></div>
    </div>

    <div class="card" id="businessSection" style="display:none;">
      <h2>Your Business</h2>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">Click a business to edit its info right here.</p>
      <div id="bizAccordion"></div>
      <a href="/account.html" style="display:block;text-align:center;font-size:13px;margin-top:6px;color:#e0562f;">Open Studio tools (Analytics, Deals, Staff, Collaborators) →</a>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('ttp_token') || '';
if (!token){ window.location.href = '/account.html'; }

let avatarUrl = '';
const params = new URLSearchParams(window.location.search);
const deepLinkBizId = params.get('biz');

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

async function init(){
  const res = await fetch('/api/me', { headers: { 'x-auth-token': token } });
  if (!res.ok){ window.location.href = '/account.html'; return; }
  const data = await res.json();

  document.getElementById('loadingView').style.display = 'none';
  document.getElementById('settingsView').style.display = 'block';
  document.getElementById('emailDisplay').textContent = data.email;
  document.getElementById('usernameInput').value = data.username || '';
  avatarUrl = data.avatarUrl || '';
  renderAvatarPreview(data.username || data.email);

  if (data.accountType === 'business'){
    document.getElementById('businessSection').style.display = 'block';
    loadBusinesses();
  }
}

function renderAvatarPreview(fallbackLabel){
  const box = document.getElementById('avatarPreview');
  box.innerHTML = avatarUrl
    ? `<img src="${avatarUrl}">`
    : (fallbackLabel || '?')[0].toUpperCase();
}

// ---------------- Avatar upload (resize to a small square, like the admin photo picker) ----------------
document.getElementById('avatarPickBtn').addEventListener('click', () => document.getElementById('avatarFileInput').click());
document.getElementById('avatarPreview').addEventListener('click', () => document.getElementById('avatarFileInput').click());
document.getElementById('avatarFileInput').addEventListener('change', (e) => {
  if (e.target.files[0]) handleAvatarFile(e.target.files[0]);
});
function handleAvatarFile(file){
  if (!file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }
  const reader = new FileReader();
  reader.onload = (evt) => {
    const img = new Image();
    img.onload = () => {
      const size = 240;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      avatarUrl = canvas.toDataURL('image/jpeg', 0.8);
      renderAvatarPreview();
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

document.getElementById('saveProfileBtn').addEventListener('click', async () => {
  const msg = document.getElementById('profileMsg');
  msg.textContent = 'Saving...';
  const res = await fetch('/api/me/profile', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
    body: JSON.stringify({
      username: document.getElementById('usernameInput').value.trim(),
      avatarUrl
    })
  });
  const data = await res.json();
  msg.textContent = res.ok ? 'Saved!' : (data.error || 'Could not save profile.');
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('ttp_token');
  window.location.href = '/account.html';
});

// ---------------- Your Business: inline accordion editor ----------------
async function loadBusinesses(){
  const box = document.getElementById('bizAccordion');
  box.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">Loading...</p>';
  const res = await fetch('/api/my/businesses', { headers: { 'x-auth-token': token } });
  const list = await res.json();
  if (!list.length){
    box.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">You haven\'t created a business yet — head to Studio to create one.</p>';
    return;
  }
  const myRes = await fetch('/api/me', { headers: { 'x-auth-token': token } });
  const me = await myRes.json();

  box.innerHTML = '';
  list.forEach(biz => {
    const isOwner = biz.ownerId === me.id;
    const row = document.createElement('div');
    row.className = 'bizAccordionRow';
    const head = document.createElement('div');
    head.className = 'bizAccordionHead';
    head.innerHTML = `<span>${escapeHtml(biz.name)}<span class="meta">${escapeHtml(biz.area || '')}</span>${isOwner ? '' : '<span class="collabTag">🤝 Collaborator</span>'}</span><span class="chev">▶</span>`;
    const body = document.createElement('div');
    body.className = 'bizAccordionBody';
    body.innerHTML = bizFormHtml(biz);
    head.addEventListener('click', () => {
      const isOpen = body.classList.contains('open');
      document.querySelectorAll('.bizAccordionBody.open').forEach(b => b.classList.remove('open'));
      document.querySelectorAll('.bizAccordionHead.open').forEach(h => h.classList.remove('open'));
      if (!isOpen){
        body.classList.add('open');
        head.classList.add('open');
        wireBizForm(body, biz);
      }
    });
    row.appendChild(head);
    row.appendChild(body);
    box.appendChild(row);

    if (deepLinkBizId && biz._id === deepLinkBizId){
      body.classList.add('open');
      head.classList.add('open');
      wireBizForm(body, biz);
      setTimeout(() => row.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
    }
  });
}

function bizFormHtml(biz){
  return `
    <label>Business Name</label>
    <input type="text" class="bf-name" value="${escapeHtml(biz.name || '')}">
    <label>Category</label>
    <input type="text" class="bf-category" value="${escapeHtml(biz.category || '')}">
    <label>Description</label>
    <textarea class="bf-description">${escapeHtml(biz.description || '')}</textarea>
    <label>Address</label>
    <input type="text" class="bf-address" value="${escapeHtml(biz.address || '')}">
    <label>Area</label>
    <input type="text" class="bf-area" value="${escapeHtml(biz.area || '')}">
    <label>Phone</label>
    <input type="text" class="bf-phone" value="${escapeHtml(biz.phone || '')}">
    <label>Email</label>
    <input type="text" class="bf-email" value="${escapeHtml(biz.email || '')}">
    <label>Hours</label>
    <input type="text" class="bf-hours" value="${escapeHtml(typeof biz.hours === 'string' ? biz.hours : '')}" placeholder="e.g. Mon-Sat 11am-9pm">
    <label>Main Photo</label>
    <div class="dropZone bf-dropzone">
      <div class="bf-dropzone-text">📷 Click to choose a photo${biz.imageUrl ? ' (or leave as is to keep the current one)' : ''}</div>
      <img class="bf-preview" style="${biz.imageUrl ? '' : 'display:none;'}" src="${biz.imageUrl || ''}">
    </div>
    <input type="file" class="bf-fileinput" accept="image/*" style="display:none;">
    <p style="font-size:12px;color:var(--text-muted);margin-top:14px;">Photo galleries, About info, and social links aren't editable here yet — those still live in the full Studio form for now.</p>
    <button type="button" class="bf-save">Save Changes</button>
    <div class="msg bf-msg"></div>
  `;
}

function wireBizForm(body, biz){
  if (body.dataset.wired) return;
  body.dataset.wired = '1';
  let newImageUrl = biz.imageUrl || '';

  const dropzone = body.querySelector('.bf-dropzone');
  const fileInput = body.querySelector('.bf-fileinput');
  const preview = body.querySelector('.bf-preview');
  const dzText = body.querySelector('.bf-dropzone-text');
  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (!e.target.files[0]) return;
    const file = e.target.files[0];
    if (!file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }
    const reader = new FileReader();
    reader.onload = (evt) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 800;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim){
          if (w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        newImageUrl = canvas.toDataURL('image/jpeg', 0.75);
        preview.src = newImageUrl;
        preview.style.display = 'block';
        dzText.style.display = 'none';
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });

  body.querySelector('.bf-save').addEventListener('click', async () => {
    const msg = body.querySelector('.bf-msg');
    msg.textContent = 'Saving...';
    const res = await fetch('/api/my/businesses/' + biz._id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'x-auth-token': token },
      body: JSON.stringify({
        name: body.querySelector('.bf-name').value,
        category: body.querySelector('.bf-category').value,
        description: body.querySelector('.bf-description').value,
        address: body.querySelector('.bf-address').value,
        area: body.querySelector('.bf-area').value,
        phone: body.querySelector('.bf-phone').value,
        email: body.querySelector('.bf-email').value,
        hours: body.querySelector('.bf-hours').value,
        imageUrl: newImageUrl
      })
    });
    const data = await res.json();
    msg.textContent = res.ok ? 'Saved!' : (data.error || 'Could not save changes.');
  });
}

init();
</script>
</body>
</html>
